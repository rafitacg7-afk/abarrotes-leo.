const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:2}).format(Number(n)||0);
const fmtDate=d=>{if(!d)return '—';let date;if(typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)){const [y,m,day]=d.split('-').map(Number);date=new Date(y,m-1,day);}else date=new Date(d);return Number.isNaN(date.getTime())?'—':new Intl.DateTimeFormat('es-MX',{day:'2-digit',month:'short',year:'numeric'}).format(date)};
const isoDay=(offset=0)=>{let d=new Date();d.setDate(d.getDate()+offset);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};

function seedData(){
 return {app:'abarrotes-leo',version:1,products:[],suppliers:[],customers:[],sales:[],purchases:[],moves:[],settings:{demo:false}};
}
function loadState(){let raw=null;try{raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);validateBackup(d);try{if(localStorage.getItem(RECOVERY_KEY)!==null)startupStorageWarning='Existe una copia de recuperación pendiente. Descárgala y revísala antes de continuar con operaciones reales.';}catch(recoveryCheckError){}return d;}}catch(e){startupStorageWarning='Los datos guardados no pasaron la validación. Se abrió un inventario vacío para evitar operar con información incompleta. Descarga la copia de recuperación antes de continuar.';try{if(raw!==null)localStorage.setItem(RECOVERY_KEY,raw);localStorage.removeItem(KEY);}catch(recoveryError){startupStorageWarning='No se pudieron validar los datos guardados y el navegador no confirmó una copia de recuperación. No uses los datos vacíos como si fueran tus datos reales.';}}if(!startupStorageWarning){try{if(localStorage.getItem(RECOVERY_KEY)!==null)startupStorageWarning='Existe una copia de recuperación pendiente. Descárgala y revísala antes de continuar con operaciones reales.';}catch(recoveryCheckError){}}return seedData();}
let db=loadState();
let lastSavedRaw=JSON.stringify(db);
try{const raw=localStorage.getItem(KEY);if(raw)lastSavedRaw=raw;else localStorage.setItem(KEY,lastSavedRaw);}catch(e){}
function save(){const raw=JSON.stringify(db);try{localStorage.setItem(KEY,raw);lastSavedRaw=raw;return true;}catch(e){try{db=JSON.parse(lastSavedRaw);}catch(restoreError){}notify('No se pudo guardar; los cambios se descartaron para evitar mostrar una operación como completada. Exporta una copia y revisa el espacio o los permisos del navegador.',true);return false;}}
function product(idv){return db.products.find(p=>p.id===idv)}function supplier(idv){return db.suppliers.find(p=>p.id===idv)}function customer(idv){return db.customers.find(p=>p.id===idv)}function variant(pid,vid){let p=product(pid);return p&&p.variants.find(v=>v.id===vid)}
function variantLabel(v){return [v.size&&v.size!=='Única'?v.size:'',v.color&&v.color!=='Único'?v.color:''].filter(Boolean).join(' · ')||'Presentación general'}
function productQty(p){return sum(p.variants||[],v=>num(v.stock))}function inventoryValue(){return sum(db.products,p=>sum(p.variants,v=>num(v.stock)*num(v.cost)))}function saleTotalPaid(s){return totalPaid(s)}
function monthSales(){let now=new Date(),m=now.getMonth(),y=now.getFullYear();return db.sales.filter(s=>{let d=new Date(s.date+'T12:00:00');return d.getMonth()===m&&d.getFullYear()===y&&s.status!=='cancelled'});}
function filteredSales(period){let now=new Date(),cut=new Date();if(period==='7d')cut.setDate(now.getDate()-7);else if(period==='30d')cut.setDate(now.getDate()-30);else if(period==='month')cut=new Date(now.getFullYear(),now.getMonth(),1);else return db.sales.filter(s=>s.status!=='cancelled');return db.sales.filter(s=>s.status!=='cancelled'&&new Date(s.date+'T23:59:59')>=cut);}
function stats(sales){return {sales:sum(sales,s=>num(s.total)),collected:sum(sales,s=>totalPaid(s)),cogs:sum(sales,s=>num(s.cogs)),expenses:sum(sales,s=>num(s.fees)+num(s.otherExpenses)),profit:sum(sales,s=>num(s.profit)),debt:sum(sales,s=>debt(s)),count:sales.length};}
function outstandingByCustomer(cid){return sum(db.sales.filter(s=>s.status!=='cancelled'&&s.customerId===cid),s=>debt(s));}
function lowStockVariants(){let a=[];db.products.filter(p=>p.active!==false).forEach(p=>(p.variants||[]).forEach(v=>{if(num(v.minStock)>0&&num(v.stock)<=num(v.minStock))a.push({p,v});}));return a;}
function notify(msg,isError=false){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast" style="${isError?'background:#9f3030':''}">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3400);}

function renderNav(){document.getElementById('desktopNav').innerHTML=navHtml(view);let basic=['dashboard','inventory','sales','customers'];document.getElementById('mobileNav').innerHTML=[...navItems.filter(n=>basic.includes(n[0])),['more','•••','Más']].map(([v,i,l])=>`<button data-view="${v}" class="${(view===v||(v==='more'&&!basic.includes(view))&&view!=='dashboard'?'active':'')}"><span>${i}</span>${l}</button>`).join('');}
const pageMeta={dashboard:['RESUMEN DEL NEGOCIO','Inicio','Una vista clara de cómo va tu negocio.'],inventory:['PRODUCTOS Y EXISTENCIAS','Inventario','Encuentra cada producto y consulta cuánto queda.'],sales:['REGISTRO DE OPERACIONES','Ventas','Registra ventas y revisa pagos y saldos pendientes.'],customers:['RELACIÓN CON TUS CLIENTES','Clientes','Historial de compra y control de fiado.'],suppliers:['ABASTECIMIENTO','Proveedores','Mantén a la mano tus proveedores y distribuidores.'],purchases:['ENTRADAS DE MERCANCÍA','Compras','Registra reposiciones y actualiza las existencias.'],reports:['NÚMEROS DEL NEGOCIO','Reportes','Consulta ventas, cobros, costos y margen estimado.'],settings:['PREFERENCIAS Y RESPALDO','Ajustes','Respalda tus datos y conoce los límites del prototipo.']};
function render(){renderNav();let meta=pageMeta[view]||pageMeta.dashboard;document.getElementById('pageEyebrow').textContent=meta[0];document.getElementById('pageTitle').textContent=meta[1];document.getElementById('pageSubtitle').textContent=meta[2];document.getElementById('content').innerHTML=({dashboard:renderDashboard,inventory:renderInventory,sales:renderSales,customers:renderCustomers,suppliers:renderSuppliers,purchases:renderPurchases,reports:renderReports,settings:renderSettings})[view]();}
function statCard(title,val,foot,icon){return `<div class="stat"><div class="stat-top"><span>${title}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${val}</div><div class="stat-foot">${foot}</div></div>`;}
function renderDashboard(){
 let s=stats(monthSales()),low=lowStockVariants(),recent=db.sales.filter(x=>x.status!=='cancelled').slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5),debts=db.sales.filter(x=>x.status!=='cancelled'&&debt(x)>0).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
 let units=sum(db.products.filter(p=>p.active!==false),productQty), activeProducts=db.products.filter(p=>p.active!==false).length, totalDebt=sum(db.sales.filter(x=>x.status!=='cancelled'),debt);
 return `${startupStorageWarning?`<section class="panel" role="alert" style="border:1px solid #c47b32;background:#fff7ed;margin-bottom:16px"><b>Atención: revisa el estado de tus datos</b><p>${esc(startupStorageWarning)}</p><button class="btn" data-action="export-recovery">Descargar copia de recuperación</button></section>`:''}
 <section class="command-deck"><div class="deck-copy"><div class="deck-kicker"><span class="deck-orbit">AL</span> ABARROTES LEO · CENTRO DE OPERACIONES <span class="demo-tag">VERSIÓN PILOTO</span></div><h2>Cada producto.<br><em>Cada peso.</em></h2><p>Controla existencias, registra ventas y detecta qué reponer antes de que falte.</p><div class="deck-actions"><button class="deck-primary" data-action="new-sale"><span>＋</span> Registrar venta</button><button class="deck-secondary" data-action="new-product">＋ Nuevo producto</button><button class="deck-secondary" data-action="new-purchase">↗ Reponer stock</button></div></div><div class="deck-side"><div class="deck-side-label">ESTE MES</div><div class="deck-revenue">${money(s.sales)}</div><div class="deck-side-caption">en ventas registradas</div><div class="deck-progress"><span style="width:${s.sales>0?Math.min(100,Math.max(8,(s.collected/s.sales)*100)):0}%"></span></div><div class="deck-side-foot"><span>${money(s.collected)} cobrados</span><span>${s.sales>0?Math.round(s.collected/s.sales*100):0}%</span></div><div class="deck-orbit-art" aria-hidden="true">A</div></div></section>
 <section class="signal-grid" aria-label="Indicadores del negocio">
  <article class="signal-card"><div class="signal-head"><span class="signal-icon sales-icon">↗</span><span class="signal-label">VENTAS</span></div><div class="signal-value">${money(s.sales)}</div><div class="signal-note">${s.count} operaciones este mes</div></article>
  <article class="signal-card"><div class="signal-head"><span class="signal-icon cash-icon">$</span><span class="signal-label">COBRADO</span></div><div class="signal-value">${money(s.collected)}</div><div class="signal-note">Dinero que ya entró</div></article>
  <article class="signal-card"><div class="signal-head"><span class="signal-icon stock-icon">▦</span><span class="signal-label">INVENTARIO</span></div><div class="signal-value">${units}<small> pzas.</small></div><div class="signal-note">${activeProducts} productos activos · ${money(inventoryValue())} a costo</div></article>
  <article class="signal-card ${totalDebt>0?'signal-alert':''}"><div class="signal-head"><span class="signal-icon debt-icon">◷</span><span class="signal-label">POR COBRAR</span></div><div class="signal-value">${money(totalDebt)}</div><div class="signal-note">Cuentas con saldo pendiente</div></article>
 </section>
 <div class="workbench-grid"><section class="workbench-main"><div class="section-intro"><div><div class="section-kicker">OPERACIÓN</div><h3>Lo que está pasando</h3></div><button class="text-action" data-view="sales">Ver todas las ventas <span>↗</span></button></div>
 <div class="surface recent-surface"><div class="surface-head"><div><h4>Actividad reciente</h4><p>Últimos movimientos de venta</p></div><span class="surface-count">${recent.length} recientes</span></div>
 ${recent.length?`<div class="activity-list">${recent.map(x=>`<div class="activity-row"><div class="activity-mark">↗</div><div class="activity-info"><b>${esc(customer(x.customerId)?.name||'Venta mostrador')}</b><span>${esc(x.id)} · ${fmtDate(x.date)}</span></div><div class="activity-total"><b>${money(x.total)}</b><span class="badge ${debt(x)>.009?'orange':'green'}">${debt(x)>.009?'Debe '+money(debt(x)):'Pagada'}</span></div></div>`).join('')}</div>`:`<div class="empty"><div class="empty-ico">↗</div>Aún no hay ventas.<br>Registra la primera para comenzar.</div>`}</div>
 <div class="section-intro attention-intro"><div><div class="section-kicker">ATENCIÓN</div><h3>Revisa antes de quedarte sin existencias</h3></div><span class="attention-count ${low.length?'has-alerts':''}">${low.length} ${low.length===1?'alerta':'alertas'}</span></div><div class="surface stock-surface">${low.length?low.slice(0,5).map(({p,v})=>`<div class="stock-row"><div class="stock-symbol">${p.category==='Bebidas'?'🥤':p.category==='Lácteos'?'🥛':p.category==='Limpieza'?'🧼':p.category==='Higiene'?'🧴':p.category==='Botanas'?'🍪':p.category==='Granos y semillas'?'🌾':'🛒'}</div><div class="stock-info"><b>${esc(p.name)}</b><span>${esc(variantLabel(v))} · mínimo ${v.minStock}</span></div><div class="stock-level ${v.stock===0?'stock-zero':''}"><b>${v.stock}</b><span>${v.stock===0?'AGOTADO':'EN STOCK'}</span></div><button class="icon-btn" title="Reponer stock" data-action="new-purchase">＋</button></div>`).join(''):`<div class="all-clear"><span>✓</span><div><b>Todo tranquilo por ahora</b><p>No hay productos por debajo de su mínimo.</p></div></div>`}<button class="surface-footer" data-view="inventory">Abrir inventario completo <span>→</span></button></div>

 <section class="quick-surface"><div class="section-kicker">ATAJOS</div><h3>¿Qué necesitas hacer?</h3><button class="quick-row" data-action="new-sale"><span class="quick-icon quick-green">↗</span><span><b>Registrar una venta</b><small>Descuenta los productos vendidos</small></span><span class="quick-arrow">→</span></button><button class="quick-row" data-action="new-purchase"><span class="quick-icon quick-amber">＋</span><span><b>Registrar una compra</b><small>Recibe mercancía o déjala pendiente</small></span><span class="quick-arrow">→</span></button><button class="quick-row" data-view="reports"><span class="quick-icon quick-blue">▥</span><span><b>Revisar resultados</b><small>Ventas, cobros y utilidad estimada</small></span><span class="quick-arrow">→</span></button><button class="quick-row" data-action="export-json"><span class="quick-icon quick-violet">↓</span><span><b>Crear respaldo</b><small>Guarda una copia de tus datos</small></span><span class="quick-arrow">→</span></button></section>
 <div class="local-note"><span>◉</span><p><b>Tu información vive aquí.</b><br>Exporta un respaldo con regularidad. Esta versión no sincroniza entre dispositivos.</p></div></aside></div>`;
}
function productMatch(p){let t=(p.name+' '+p.category+' '+p.brand+' '+(supplier(p.supplierId)?.name||'')+' '+p.variants.map(variantLabel).join(' ')).toLowerCase();return t.includes(searchText.toLowerCase());}
function renderInventory(){let ps=db.products.filter(p=>p.active!==false&&productMatch(p));return `<div class="toolbar"><div class="search"><span>⌕</span><input id="searchProducts" value="${esc(searchText)}" placeholder="Buscar producto, marca o presentación…" aria-label="Buscar productos"></div><select id="stockFilter" class="btn" style="padding:10px 12px"><option value="all">Todo el inventario</option><option value="low">Stock bajo</option><option value="out">Agotados</option></select><button class="btn btn-primary" data-action="new-product">＋ Agregar producto</button></div><div class="kpi-row" style="margin-bottom:15px"><div class="kpi-chip"><span>Productos activos</span><b>${db.products.filter(p=>p.active!==false).length}</b></div><div class="kpi-chip"><span>Unidades disponibles</span><b>${sum(db.products.filter(p=>p.active!==false),productQty)}</b></div><div class="kpi-chip"><span>Valor a costo</span><b>${money(inventoryValue())}</b></div></div><div id="inventoryGrid" class="grid product-grid">${productCards(ps,'all')}</div>`;}
function productCards(ps,filter){if(filter==='low')ps=ps.filter(p=>p.variants.some(v=>v.minStock>0&&v.stock<=v.minStock));if(filter==='out')ps=ps.filter(p=>productQty(p)===0);if(!ps.length)return `<div class="panel" style="grid-column:1/-1"><div class="empty"><div class="empty-ico">♧</div>No encontramos productos con ese filtro.<br>Prueba otra búsqueda o agrega un producto.</div></div>`;return ps.map(p=>{let qty=productQty(p),value=sum(p.variants,v=>v.stock*v.cost),low=p.variants.some(v=>v.minStock>0&&v.stock<=v.minStock),supplierName=supplier(p.supplierId)?.name||'Proveedor no asignado';return `<article class="product-card"><div class="product-top"><div style="display:flex;gap:10px;min-width:0"><div class="product-symbol">${p.category==='Bebidas'?'🥤':p.category==='Lácteos'?'🥛':p.category==='Limpieza'?'🧼':p.category==='Higiene'?'🧴':p.category==='Botanas'?'🍪':p.category==='Granos y semillas'?'🌾':'🛒'}</div><div style="min-width:0"><h3 class="product-name">${esc(p.name)}</h3><div class="product-meta">${esc(p.category)}${p.brand?' · '+esc(p.brand):''}</div><div class="product-meta" style="margin-top:4px">${esc(supplierName)}</div></div></div>${qty===0?'<span class="badge red">Agotado</span>':low?'<span class="badge orange">Stock bajo</span>':'<span class="badge green">Disponible</span>'}</div><div class="product-numbers"><div><b>${qty} <small style="font-size:10px;font-weight:650">unid.</small></b><span>Existencias</span></div><div><b>${money(Math.min(...p.variants.map(v=>v.price))||0)}</b><span>Precio desde</span></div></div><div class="variant-list">${p.variants.map(v=>`<span class="variant-chip ${v.minStock>0&&v.stock<=v.minStock?'low':''}">${esc(variantLabel(v))}: <b>${v.stock}</b></span>`).join('')}</div><div class="product-meta">Valor a costo: <b style="color:var(--ink)">${money(value)}</b></div><div class="product-actions" style="margin-top:13px"><button class="btn btn-sm btn-soft" data-action="edit-product" data-id="${p.id}">Editar</button><button class="btn btn-sm" data-action="product-sale" data-id="${p.id}" ${qty===0?'disabled':''}>Vender ↗</button><button class="icon-btn" title="Archivar producto" data-action="archive-product" data-id="${p.id}">⋯</button></div></article>`;}).join('');}
function renderSales(){let items=db.sales.filter(s=>s.status!=='cancelled').slice().sort((a,b)=>b.date.localeCompare(a.date)),st=stats(items);return `<div class="grid stats">${statCard('Ventas registradas',st.count,'Operaciones completas','↗')}${statCard('Venta total',money(st.sales),'Antes de restar costo y gastos','₱')}${statCard('Cobrado',money(st.collected),'Dinero recibido','✓')}${statCard('Por cobrar',money(st.debt),'Saldos pendientes','◷')}</div><div class="toolbar"><div class="search"><span>⌕</span><input id="searchSales" placeholder="Buscar por folio, cliente o canal…" aria-label="Buscar ventas"></div><button class="btn btn-primary" data-action="new-sale">＋ Registrar venta</button><button class="btn" data-action="export-sales">Descargar CSV</button></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Folio / Fecha</th><th>Cliente / Canal</th><th>Total</th><th>Utilidad est.</th><th>Cobrado</th><th>Estado</th><th></th></tr></thead><tbody id="salesRows">${salesRows(items)}</tbody></table></div></div><div class="hint" style="margin-top:12px">La utilidad es una estimación: venta menos costo registrado y gastos directos capturados. No sustituye una contabilidad fiscal.</div>`;}
function salesRows(items){if(!items.length)return `<tr><td colspan="7"><div class="empty">No hay ventas registradas.</div></td></tr>`;return items.map(s=>`<tr><td><b>${esc(s.id)}</b><div class="small muted">${fmtDate(s.date)}</div></td><td>${esc(customer(s.customerId)?.name||'Mostrador')}<div class="small muted">${esc(s.channel||'—')}</div></td><td class="amount">${money(s.total)}</td><td class="amount" style="color:${s.profit>=0?'var(--green)':'var(--red)'}">${money(s.profit)}</td><td>${money(totalPaid(s))}</td><td>${debt(s)>.009?`<span class="badge orange">Debe ${money(debt(s))}</span>`:'<span class="badge green">Pagada</span>'}</td><td><button class="btn btn-sm" data-action="sale-detail" data-id="${s.id}">Detalle</button>${debt(s)>.009?` <button class="btn btn-sm btn-soft" data-action="add-payment" data-sale="${s.id}">Abonar</button>`:''}</td></tr>`).join('');}
function renderCustomers(){let cs=db.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(searchText.toLowerCase()));let outstanding=sum(cs,c=>outstandingByCustomer(c.id));return `<div class="grid stats">${statCard('Clientes',db.customers.length,'Contactos registrados','♙')}${statCard('Saldo por cobrar',money(outstanding),'Solo ventas con pago pendiente','◷')}${statCard('Con saldo pendiente',cs.filter(c=>outstandingByCustomer(c.id)>.009).length,'Clientes con fiado activo','!')}${statCard('Ventas registradas',db.sales.filter(s=>s.status!=='cancelled'&&s.customerId).length,'Ventas vinculadas a clientes','↗')}</div><div class="toolbar"><div class="search"><span>⌕</span><input id="searchCustomers" value="${esc(searchText)}" placeholder="Buscar cliente por nombre o teléfono…"></div><button class="btn btn-primary" data-action="new-customer">＋ Nuevo cliente</button></div><div class="panel"><div class="panel-head"><div><div class="panel-title">Lista de clientes</div><div class="panel-desc">El saldo se calcula desde cada venta y sus abonos.</div></div></div>${cs.length?cs.map(c=>{let sales=db.sales.filter(s=>s.status!=='cancelled'&&s.customerId===c.id),bal=outstandingByCustomer(c.id);return `<div class="list-card"><div class="avatar">${esc(c.name.slice(0,1).toUpperCase())}</div><div class="list-main"><div class="list-name">${esc(c.name)}</div><div class="list-meta">${esc(c.phone||'Sin teléfono')} · ${sales.length} venta(s)${c.notes?' · '+esc(c.notes):''}</div></div><div style="text-align:right;min-width:110px"><div class="amount" style="color:${bal?'var(--orange)':'var(--green)'}">${money(bal)}</div><div class="small muted" style="margin:4px 0 6px">${bal?'Pendiente':'Sin adeudo'}</div>${bal?`<button class="btn btn-sm btn-soft" data-action="customer-payment" data-id="${c.id}">Registrar abono</button>`:''}<button class="btn btn-sm" style="margin-left:3px" data-action="edit-customer" data-id="${c.id}">Editar</button></div></div>`;}).join(''):`<div class="empty">No hay clientes con esa búsqueda.</div>`}</div><div class="panel"><div class="panel-head"><div><div class="panel-title">Saldos abiertos</div><div class="panel-desc">Cada abono se vincula con una venta concreta.</div></div></div>${db.sales.filter(s=>s.status!=='cancelled'&&debt(s)>.009).length?`<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Venta</th><th>Fecha</th><th>Falta cobrar</th><th></th></tr></thead><tbody>${db.sales.filter(s=>s.status!=='cancelled'&&debt(s)>.009).map(s=>`<tr><td>${esc(customer(s.customerId)?.name||'Cliente')}</td><td>${esc(s.id)}</td><td>${fmtDate(s.date)}</td><td class="amount">${money(debt(s))}</td><td><button class="btn btn-sm btn-soft" data-action="add-payment" data-sale="${s.id}">Abonar</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Todo al corriente. No hay cuentas por cobrar.</div>`}</div>`;}
function renderSuppliers(){let ss=db.suppliers.filter(s=>(s.name+' '+s.phone+' '+s.source).toLowerCase().includes(searchText.toLowerCase()));return `<div class="toolbar"><div class="search"><span>⌕</span><input id="searchSuppliers" value="${esc(searchText)}" placeholder="Buscar proveedor, teléfono o fuente…"></div><button class="btn btn-primary" data-action="new-supplier">＋ Agregar proveedor</button><button class="btn" data-action="new-purchase">＋ Registrar compra</button></div><div class="grid product-grid">${ss.length?ss.map(s=>{let ps=db.purchases.filter(p=>p.supplierId===s.id),total=sum(ps,p=>p.total);return `<article class="product-card"><div class="product-top"><div style="display:flex;gap:10px;align-items:center"><div class="product-symbol">▤</div><div><div class="product-name">${esc(s.name)}</div><div class="product-meta">${esc(s.source||'Fuente sin especificar')}</div></div></div><button class="icon-btn" data-action="edit-supplier" data-id="${s.id}" title="Editar">✎</button></div><div class="product-numbers"><div><b>${ps.length}</b><span>Compras registradas</span></div><div><b>${money(total)}</b><span>Monto comprado</span></div></div><div class="product-meta">☎ ${esc(s.phone||'Sin teléfono')}</div>${s.notes?`<div class="product-meta" style="margin-top:8px">${esc(s.notes)}</div>`:''}<div class="product-actions" style="margin-top:14px"><button class="btn btn-sm btn-soft" data-action="new-purchase" data-supplier="${s.id}">Reponer stock</button><button class="btn btn-sm" data-action="edit-supplier" data-id="${s.id}">Editar</button></div></article>`;}).join(''):`<div class="panel" style="grid-column:1/-1"><div class="empty">Todavía no hay proveedores registrados.</div></div>`}</div><div class="hint" style="margin-top:13px">En esta versión se guarda el historial de compras por proveedor, pero aún no hay control de cuentas por pagar al proveedor.</div>`;}
function renderPurchases(){let purchases=db.purchases.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="grid stats">${statCard('Compras registradas',purchases.length,'Entradas guardadas','▤')}${statCard('Monto de compras',money(sum(purchases,p=>p.total)),'Incluye gastos adicionales capturados','₱')}${statCard('Recibidas',purchases.filter(p=>p.received).length,'Ya afectan el inventario','✓')}${statCard('Pendientes de recibir',purchases.filter(p=>!p.received).length,'No afectan el stock todavía','◷')}</div><div class="toolbar"><button class="btn btn-primary" data-action="new-purchase">＋ Registrar compra</button><button class="btn" data-action="export-purchases">Descargar CSV</button></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Folio / Fecha</th><th>Proveedor</th><th>Artículos</th><th>Total</th><th>Estado</th></tr></thead><tbody>${purchases.length?purchases.map(p=>`<tr><td><b>${esc(p.id)}</b><div class="small muted">${fmtDate(p.date)}</div></td><td>${esc(p.supplierName||supplier(p.supplierId)?.name||'—')}</td><td>${p.items.length} línea(s)<div class="small muted">${esc(p.items.slice(0,2).map(i=>i.productName).join(', '))}${p.items.length>2?'…':''}</div></td><td class="amount">${money(p.total)}</td><td>${p.received?'<span class="badge green">Recibida</span>':`<span class="badge orange">Por recibir</span><div style="margin-top:6px"><button class="btn btn-sm btn-soft" data-action="receive-purchase" data-id="${p.id}">Confirmar recepción</button></div>`}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">Aún no registras compras.</div></td></tr>`}</tbody></table></div></div><div class="hint" style="margin-top:12px">Al marcar una compra como recibida, el stock sube y el costo promedio de la presentación se actualiza.</div>`;}
function renderReports(){let period='30d',s=stats(filteredSales(period)),all=filteredSales(period),itemCounts={};all.forEach(s=>s.items.forEach(i=>{let k=i.productName;itemCounts[k]=(itemCounts[k]||0)+i.qty;}));let tops=Object.entries(itemCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);return `<div class="toolbar"><label class="small muted" for="reportPeriod">Periodo</label><select id="reportPeriod" class="btn"><option value="7d">Últimos 7 días</option><option value="30d" selected>Últimos 30 días</option><option value="month">Este mes</option><option value="all">Todo el historial</option></select><button class="btn" data-action="export-json">Respaldar todos los datos</button><button class="btn" data-action="export-sales">Ventas CSV</button></div><div id="reportStats" class="grid stats">${statCard('Ventas',money(s.sales),`${s.count} operaciones`,'↗')}${statCard('Dinero cobrado',money(s.collected),'Pagos recibidos','✓')}${statCard('Costo vendido',money(s.cogs),'Costo capturado de los productos','♧')}${statCard('Utilidad estimada',money(s.profit),'Antes de impuestos y gastos generales','◈')}</div><div class="grid dash-grid"><div class="panel"><div class="panel-head"><div><div class="panel-title">Detalle de ventas</div><div class="panel-desc">Transacciones dentro del periodo elegido</div></div></div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Folio</th><th>Venta</th><th>Costo</th><th>Utilidad est.</th></tr></thead><tbody id="reportSalesRows">${reportRows(all)}</tbody></table></div></div><div><div class="panel"><div class="panel-title">Productos más vendidos</div><div class="panel-desc">Unidades, no ingresos, dentro del periodo</div><div style="margin-top:12px">${tops.length?tops.map(([n,q],i)=>`<div class="list-card"><div class="avatar">${i+1}</div><div class="list-main"><div class="list-name">${esc(n)}</div><div class="list-meta">${q} unidad(es)</div></div></div>`).join(''):`<div class="empty">Aún no hay datos suficientes.</div>`}</div></div><div class="panel"><div class="panel-title">Lectura del periodo</div><div class="rule"></div><div class="list-card"><div class="list-main"><div class="list-meta">Por cobrar</div></div><div class="amount">${money(s.debt)}</div></div><div class="list-card"><div class="list-main"><div class="list-meta">Gastos directos y comisiones</div></div><div class="amount">${money(s.expenses)}</div></div><div class="list-card"><div class="list-main"><div class="list-meta">Inventario a costo actual</div></div><div class="amount">${money(inventoryValue())}</div></div></div></div></div><div class="panel" style="margin-top:15px"><div class="panel-head"><div><div class="panel-title">Movimientos recientes de inventario</div><div class="panel-desc">Entradas, ventas, ajustes y cancelaciones con su motivo.</div></div><button class="inline-link" data-action="export-inventory">Exportar inventario →</button></div>${db.moves&&db.moves.length?`<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Movimiento</th><th>Producto / presentación</th><th>Cantidad</th><th>Motivo</th></tr></thead><tbody>${db.moves.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,10).map(m=>`<tr><td>${fmtDate(m.date)}</td><td>${esc(m.type)}</td><td>${esc(m.label)}</td><td class="amount" style="color:${m.qty>=0?'var(--green)':'var(--red)'}">${m.qty>0?'+':''}${m.qty}</td><td class="small muted">${esc(m.note||'—')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Todavía no hay movimientos de stock.</div>`}</div><div class="warn-box" style="margin-top:15px">Interpretación: estos datos sirven para controlar la operación. No incluyen obligaciones fiscales, impuestos, renta, nómina, ni gastos que no registres manualmente. La utilidad es estimada y depende de que los costos estén completos.</div>`;}
function reportRows(all){return all.length?all.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<tr><td>${fmtDate(s.date)}</td><td>${esc(s.id)}</td><td class="amount">${money(s.total)}</td><td>${money(s.cogs)}</td><td class="amount">${money(s.profit)}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">No hay ventas en este periodo.</div></td></tr>`;}
function renderSettings(){return `<div class="panel"><div class="panel-head"><div><div class="panel-title">Instalar Abarrotes Leo</div><div class="panel-desc">Agrega la app a la pantalla de inicio del teléfono.</div></div><span class="badge green">Acceso rápido</span></div><div class="small" style="line-height:1.8"><b>Android:</b> abre el enlace en Chrome, toca el menú ⋮ y elige “Instalar aplicación” o “Añadir a pantalla de inicio”.<br><b>iPhone:</b> abre el enlace en Safari, toca Compartir y después “Añadir a pantalla de inicio”.<br><b>Primera vez:</b> abre la app conectado a internet para que pueda guardar los recursos necesarios para el modo sin conexión.</div><div class="warn-box" style="margin-top:12px">Los productos, ventas y demás registros se guardan en este navegador y este dispositivo. No se sincronizan automáticamente con otro teléfono. Exporta respaldos JSON de forma regular y guárdalos fuera del teléfono.</div></div>${startupStorageWarning?`<div class="panel" role="alert" style="border:1px solid #c47b32;background:#fff7ed"><b>Atención: revisa el estado de tus datos</b><p>${esc(startupStorageWarning)}</p><button class="btn" data-action="export-recovery">Descargar copia de recuperación</button></div>`:''}<div class="grid dash-grid"><div><div class="panel"><div class="panel-head"><div><div class="panel-title">Copia de seguridad</div><div class="panel-desc">Los datos se guardan en este navegador; no se sincronizan con otro dispositivo.</div></div><span class="badge green">Exportable</span></div><p class="small muted" style="line-height:1.7">Descarga un respaldo antes de cambiar de dispositivo o borrar los datos del navegador. Para recuperar la información, importa el JSON generado por Abarrotes Leo.</p><div class="grid" style="grid-template-columns:1fr 1fr;gap:9px;margin-top:15px"><button class="btn btn-primary" data-action="export-json">⬇ Exportar respaldo JSON</button><button class="btn" data-action="import-json">⬆ Importar respaldo JSON</button><button class="btn" data-action="export-inventory">Inventario CSV</button><button class="btn" data-action="export-sales">Ventas CSV</button><button class="btn" data-action="export-purchases">Compras CSV</button></div><input id="backupFile" type="file" accept="application/json,.json" class="hidden"></div><div class="panel"><div class="panel-title">Acerca de Abarrotes Leo</div><div class="rule"></div><div class="good-box"><b>Prototipo v0.1 · Adaptado desde RopaLista</b><br>Permite registrar productos y presentaciones, existencias, ventas, compras, clientes, proveedores, abonos y reportes dentro de este dispositivo.</div><div class="section-label">Límites actuales</div><div class="small muted" style="line-height:1.8">• No hay cuentas de usuario ni sincronización entre dispositivos.<br>• Registra unidades completas (pieza, botella, bolsa, caja o paquete); no admite cantidades fraccionarias por peso.<br>• Aún no controla lotes ni fechas de caducidad.<br>• No procesa pagos, emite facturas ni hace declaraciones fiscales.<br>• La utilidad es estimada y depende de registrar costos y gastos correctamente.<br>• El respaldo externo es responsabilidad de quien usa la app.</div></div></div><div><div class="panel"><div class="panel-title">Cómo empezar</div><div class="panel-desc">Orden recomendado para ponerlo en marcha con datos reales.</div><div class="help-step"><div class="step-num">1</div><div><b>Registra los productos</b><p>Agrega nombre, categoría, marca opcional, presentación, costo, precio y existencias actuales.</p></div></div><div class="help-step"><div class="step-num">2</div><div><b>Registra proveedores</b><p>Guarda cada proveedor o distribuidor y después registra las compras que recibas.</p></div></div><div class="help-step"><div class="step-num">3</div><div><b>Registra ventas de mostrador</b><p>Elige productos, cantidades y pago recibido. La app descuenta existencias al confirmar.</p></div></div><div class="help-step"><div class="step-num">4</div><div><b>Revisa reposición y resultados</b><p>Define mínimos, revisa productos bajos y exporta respaldos con regularidad.</p></div></div><div class="warn-box" style="margin-top:12px">Importante: empieza revisando físicamente las existencias. Los datos iniciales están vacíos; no hay ventas ni productos ficticios mezclados con los de Leo.</div></div><div class="panel"><div class="panel-title">Reiniciar datos locales</div><div class="panel-desc">Vacía los registros guardados en este navegador.</div><div class="rule"></div><button class="btn btn-danger" data-action="reset-demo">Vaciar los datos</button><div class="hint" style="margin-top:9px">Esta acción es destructiva. Descarga un respaldo antes de usarla.</div></div></div></div>`;}
function modal(title,sub,body,opts={}){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><div class="modal-title">${title}</div><div class="modal-sub">${sub||''}</div></div><button class="icon-btn" data-action="close-modal" aria-label="Cerrar">✕</button></div><div class="modal-body">${body}</div></div></div>`;document.body.style.overflow='hidden';}

ss="sale-preview"><div><span class="small muted">Total de venta</span><br><strong id="salePreviewTotal">$0.00</strong></div><div><span class="small muted">Saldo por cobrar</span><br><b id="salePreviewDebt">$0.00</b></div><div><span class="small muted">Utilidad estimada</span><br><b id="salePreviewProfit">$0.00</b></div></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Confirmar venta</button></div></form>`;modal('Registrar venta','Las existencias se descontarán al confirmar la operación.',body);document.querySelectorAll('[name="saleItem"]').forEach(el=>el.addEventListener('change',e=>{let op=e.target.selectedOptions[0];let row=e.target.closest('[data-sale-line]');if(row&&op&&op.dataset.price){row.querySelector('[name="salePrice"]').value=op.dataset.price;}updateSalePreview();}));document.getElementById('sale-form').addEventListener('input',e=>{if(e.target.name==='paidNow')document.getElementById('sale-form').dataset.paymentTouched='1';updateSalePreview();});updateSalePreview();}
function updateSalePreview(){let form=document.getElementById('sale-form');if(!form)return;let gross=0,cogs=0,valid=true;form.querySelectorAll('[data-sale-line]').forEach(row=>{let key=row.querySelector('[name="saleItem"]').value.split('|'),qty=num(row.querySelector('[name="saleQty"]').value),price=num(row.querySelector('[name="salePrice"]').value),v=key.length===2?variant(key[0],key[1]):null;if(!v){valid=false;return;}gross+=qty*price;cogs+=qty*num(v.cost);});let discount=num(form.elements.discount.value),expenses=num(form.elements.expenses.value),total=Math.max(0,gross-discount);let paidInput=form.elements.paidNow;if(!form.dataset.paymentTouched)paidInput.value=total.toFixed(2);let paid=num(paidInput.value);document.getElementById('salePreviewTotal').textContent=money(total);document.getElementById('salePreviewDebt').textContent=money(Math.max(0,total-paid));document.getElementById('salePreviewProfit').textContent=money(total-cogs-expenses);}

function simpleContactForm(type,existing){let c=existing||{},isCustomer=type==='customer',editing=!!existing;let title=isCustomer?(editing?'Editar cliente':'Nuevo cliente'):(editing?'Editar proveedor':'Agregar proveedor');let body=`<form id="${type}-form"><div class="form-grid"><div class="field full"><label>${isCustomer?'Nombre del cliente':'Nombre del proveedor'} *</label><input name="name" required maxlength="100" value="${esc(c.name||'')}"></div><div class="field"><label>Teléfono / WhatsApp</label><input name="phone" inputmode="tel" value="${esc(c.phone||'')}" placeholder="Número de contacto"></div>${isCustomer?'':`<div class="field"><label>Tipo de proveedor / fuente</label><input name="source" value="${esc(c.source||'')}" placeholder="Mayoreo, bazar, fabricante…"></div>`}<div class="field full"><label>Notas</label><textarea name="notes" placeholder="Preferencias, condiciones, comentarios…">${esc(c.notes||'')}</textarea></div></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="submit">${editing?'Guardar cambios':'Guardar'}</button></div><input type="hidden" name="contactId" value="${c.id||''}"></form>`;modal(title,'Datos básicos de contacto. No se enviarán mensajes automáticamente.',body);}
function paymentForm(saleId,cid){let sales=db.sales.filter(s=>s.status!=='cancelled'&&debt(s)>.009&&(!saleId||s.id===saleId)&&(!cid||s.customerId===cid));if(!sales.length){notify('No hay saldos pendientes para abonar.');return;}let body=`<form id="payment-form"><div class="form-grid"><div class="field full"><label>Venta pendiente *</label><select name="saleId" required>${sales.map(s=>`<option value="${s.id}" data-debt="${debt(s)}" ${saleId===s.id?'selected':''}>${esc(s.id)} · ${esc(customer(s.customerId)?.name||'Cliente')} · debe ${money(debt(s))}</option>`).join('')}</select></div><div class="field"><label>Importe recibido ($) *</label><input name="amount" type="number" min="0.01" step="0.01" required max="${debt(sales[0])}" value="${Math.min(debt(sales[0]),100)}"></div><div class="field"><label>Forma de pago</label><select name="method"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Otro</option></select></div><div class="field"><label>Fecha *</label><input name="date" type="date" value="${isoDay()}" required></div><div class="field"><label>Nota</label><input name="note" placeholder="Ej. segundo abono"></div></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Registrar abono</button></div></form>`;modal('Registrar abono','El pago se aplicará a la venta seleccionada y reducirá su saldo.',body);let sel=document.querySelector('#payment-form [name="saleId"]'),amount=document.querySelector('#payment-form [name="amount"]');sel.addEventListener('change',()=>{let d=num(sel.selectedOptions[0].dataset.debt);amount.max=d;amount.value=d;});}
function detailSale(s){if(!s)return;let lines=s.items.map(i=>`<div class="list-card"><div class="list-main"><div class="list-name">${esc(i.productName)}</div><div class="list-meta">${esc(i.variantLabel)} · ${i.qty} × ${money(i.unitPrice)}</div></div><div class="amount">${money(i.subtotal)}</div></div>`).join('');let body=`<div class="kpi-row"><div class="kpi-chip"><span>Total</span><b>${money(s.total)}</b></div><div class="kpi-chip"><span>Cobrado</span><b>${money(totalPaid(s))}</b></div><div class="kpi-chip"><span>Pendiente</span><b>${money(debt(s))}</b></div><div class="kpi-chip"><span>Utilidad est.</span><b>${money(s.profit)}</b></div></div><div class="section-label">Productos</div>${lines}<div class="rule"></div><div class="list-card"><div class="list-main"><div class="list-name">Costo de los productos</div></div><div>${money(s.cogs)}</div></div><div class="list-card"><div class="list-main"><div class="list-name">Gastos directos</div></div><div>${money(num(s.fees)+num(s.otherExpenses))}</div></div><div class="section-label">Pagos registrados</div>${(s.payments||[]).map(p=>`<div class="list-card"><div class="list-main"><div class="list-name">${esc(p.method||'Pago')}</div><div class="list-meta">${fmtDate(p.date)} ${p.note?'· '+esc(p.note):''}</div></div><div class="amount">${money(p.amount)}</div></div>`).join('')||'<div class="empty">Sin abonos.</div>'}<div class="modal-foot"><button class="btn" data-action="close-modal">Cerrar</button>${s.status!=='cancelled'?`<button class="btn btn-danger" data-action="cancel-sale" data-id="${s.id}">Cancelar venta y devolver stock</button>`:''}${debt(s)>.009&&s.status!=='cancelled'?`<button class="btn btn-primary" data-action="add-payment" data-sale="${s.id}">Registrar abono</button>`:''}</div>`;modal('Detalle de venta '+s.id,`Registrada el ${fmtDate(s.date)} · ${esc(s.channel||'')}`,body);}
function addStockMove(type,p,v,qty,note){db.moves.unshift({id:id('mov'),date:isoDay(),type,productId:p.id,variantId:v.id,label:p.name+' · '+variantLabel(v),qty,note});}
function handleProductSubmit(form){let fd=new FormData(form),pid=fd.get('productId'),old=pid?product(pid):null,name=fd.get('name').trim(),mode=fd.get('mode');let rows=[...form.querySelectorAll('[data-variant-row]')];if(!rows.length){notify('Agrega al menos una presentación.',true);return;}let variants=[];for(let r of rows){let size=r.querySelector('[name="variantSize"]').value.trim(),color=r.querySelector('[name="variantColor"]').value.trim(),stock=num(r.querySelector('[name="variantStock"]').value),cost=num(r.querySelector('[name="variantCost"]').value),price=num(r.querySelector('[name="variantPrice"]').value),min=num(r.querySelector('[name="variantMin"]').value),vid=r.querySelector('[name="variantId"]').value||id('v');if(!size||stock<0||cost<0||price<0||min<0){notify('Revisa presentación, existencias y precios.',true);return;}variants.push({id:vid,size,color,stock:Math.floor(stock),cost,price,minStock:Math.floor(min)});}
 if(mode==='unique'){variants[0].size='Única';variants[0].color='Único';variants[0].stock=Math.min(1,variants[0].stock);variants=variants.slice(0,1);}
 let keys=variants.map(v=>(v.size+'|'+v.color).toLowerCase());if(new Set(keys).size!==keys.length){notify('Hay presentaciones repetidas con la misma unidad.',true);return;}
 let p={id:pid||id('p'),name,category:fd.get('category'),brand:fd.get('brand').trim(),supplierId:fd.get('supplierId'),mode,notes:fd.get('notes').trim(),active:true,variants};if(old){p.active=old.active;let oldVar=old.variants||[];let removed=oldVar.filter(ov=>!variants.some(v=>v.id===ov.id));if(removed.some(ov=>num(ov.stock)>0)){notify('No puedes quitar una presentación que todavía tiene stock. Ajusta sus existencias a cero primero.',true);return;}removed.forEach(ov=>addStockMove('Retiro de presentación',old,ov,-num(ov.stock),'Presentación retirada desde la ficha de producto'));variants.forEach(v=>{let ov=oldVar.find(x=>x.id===v.id);if(!ov)addStockMove('Entrada inicial',p,v,v.stock,'Nueva presentación agregada');else if(ov.stock!==v.stock)addStockMove('Ajuste',p,v,v.stock-ov.stock,'Ajuste manual de existencias desde ficha de producto');});db.products[db.products.findIndex(x=>x.id===pid)]=p;}else{db.products.unshift(p);variants.forEach(v=>{if(v.stock)addStockMove('Entrada inicial',p,v,v.stock,'Inventario inicial del producto');});}if(!save())return;closeModal();render();notify(old?'Producto actualizado.':'Producto guardado en inventario.');}
function handleSaleSubmit(form){let fd=new FormData(form),rows=[...form.querySelectorAll('[data-sale-line]')],items=[],stockMap={},gross=0,cogs=0;for(let r of rows){let key=r.querySelector('[name="saleItem"]').value.split('|'),qty=num(r.querySelector('[name="saleQty"]').value),price=num(r.querySelector('[name="salePrice"]').value);if(key.length!==2||qty<1||!Number.isInteger(qty)||price<0){notify('Revisa producto, cantidad y precio de venta.',true);return;}let p=product(key[0]),v=variant(key[0],key[1]);if(!p||!v||p.active===false){notify('Un producto dejó de estar disponible. Actualiza el formulario.',true);return;}stockMap[v.id]=(stockMap[v.id]||0)+qty;if(stockMap[v.id]>v.stock){notify(`No hay existencias suficientes de ${p.name} (${variantLabel(v)}). Disponible: ${v.stock}.`,true);return;}let sub=qty*price;gross+=sub;cogs+=qty*num(v.cost);items.push({productId:p.id,variantId:v.id,productName:p.name,variantLabel:variantLabel(v),qty,unitPrice:price,costEach:num(v.cost),subtotal:sub});}
 let discount=num(fd.get('discount')),expenses=num(fd.get('expenses')),total=gross-discount,paid=num(fd.get('paidNow')),cid=fd.get('customerId');if(discount<0||discount>gross||expenses<0||paid<0||paid>total){notify('Revisa descuento, gastos y el importe recibido. No pueden ser negativos ni superar el total.',true);return;}if(total<=0){notify('El total debe ser mayor que cero.',true);return;}if(paid<total&&!cid){notify('Para registrar una venta con saldo pendiente, primero selecciona un cliente.',true);return;}let s={id:id('V'),date:fd.get('date'),customerId:cid||'',channel:fd.get('channel'),paymentMethod:fd.get('method'),gross,discount,total,fees:expenses,otherExpenses:0,cogs,profit:total-cogs-expenses,items,payments:paid>0?[{date:fd.get('date'),amount:paid,method:fd.get('method'),note:paid<total?'Pago inicial':'Pago completo'}]:[],status:'confirmed'};
 items.forEach(i=>{let v=variant(i.productId,i.variantId),p=product(i.productId);v.stock-=i.qty;addStockMove('Venta',p,v,-i.qty,'Venta '+s.id);});db.sales.unshift(s);if(!save())return;closeModal();render();notify(`Venta ${s.id} registrada. Stock actualizado.`);}
function handlePurchaseSubmit(form){let fd=new FormData(form),rows=[...form.querySelectorAll('[data-purchase-line]')],items=[],qtyTotal=0,base=0,purchaseQtyMap={};for(let r of rows){let key=r.querySelector('[name="purchaseItem"]').value.split('|'),qty=num(r.querySelector('[name="purchaseQty"]').value),cost=num(r.querySelector('[name="purchaseCost"]').value);let p=key.length===2?product(key[0]):null,v=key.length===2?variant(key[0],key[1]):null;if(!p||!v||qty<1||!Number.isInteger(qty)||cost<0){notify('Revisa producto, unidades y costo de compra.',true);return;}purchaseQtyMap[v.id]=(purchaseQtyMap[v.id]||0)+qty;if(p.mode==='unique'&&num(v.stock)+purchaseQtyMap[v.id]>1){notify('Este producto está marcado como una sola unidad. Corrige su configuración o registra cantidades normales.',true);return;}qtyTotal+=qty;base+=qty*cost;items.push({productId:p.id,variantId:v.id,productName:p.name,variantLabel:variantLabel(v),qty,unitCost:cost});}if(!items.length){notify('Agrega al menos una línea a la compra.',true);return;}let extra=num(fd.get('extraCost'));if(extra<0){notify('El gasto adicional no puede ser negativo.',true);return;}let total=base+extra,received=fd.get('received')==='yes',sp=supplier(fd.get('supplierId'));let pu={id:id('C'),date:fd.get('date'),supplierId:fd.get('supplierId'),supplierName:sp?.name||'Sin proveedor',items,extraCost:extra,total,received,notes:fd.get('notes').trim()};if(received){let extraEach=qtyTotal?extra/qtyTotal:0;items.forEach(i=>{let p=product(i.productId),v=variant(i.productId,i.variantId),oldQty=num(v.stock),newCost=i.unitCost+extraEach;v.cost=oldQty+i.qty>0?((oldQty*num(v.cost))+(i.qty*newCost))/(oldQty+i.qty):newCost;v.stock+=i.qty;addStockMove('Compra',p,v,i.qty,'Compra '+pu.id+' · '+pu.supplierName);});}db.purchases.unshift(pu);if(!save())return;closeModal();render();notify(received?'Compra guardada y stock actualizado.':'Compra guardada; aún no se modificó el stock.');}
function handlePaymentSubmit(form){let fd=new FormData(form),s=db.sales.find(x=>x.id===fd.get('saleId')),amt=num(fd.get('amount'));if(!s||s.status==='cancelled'){notify('La venta no está disponible.',true);return;}if(amt<=0||amt>debt(s)+.009){notify('El abono debe ser mayor que cero y no superar el saldo pendiente.',true);return;}s.payments=s.payments||[];s.payments.push({date:fd.get('date'),amount:amt,method:fd.get('method'),note:fd.get('note').trim()});if(!save())return;closeModal();render();notify(debt(s)<.01?'Abono registrado. La venta quedó pagada.':'Abono registrado; saldo actualizado.');}

function validateBackup(x){
 const arrays=['products','sales','customers','suppliers','purchases'];
 if(!x||x.app!=='abarrotes-leo'||x.version!==1||arrays.some(k=>!Array.isArray(x[k])))throw new Error('El archivo no es un respaldo válido de Abarrotes Leo');
 const finiteNumber=v=>typeof v==='number'&&Number.isFinite(v);
 const finiteNonnegative=v=>finiteNumber(v)&&v>=0;
 const safeId=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,100}$/.test(v);
 const validDate=d=>{if(typeof d!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(d))return false;const [y,m,day]=d.split('-').map(Number),t=new Date(y,m-1,day);return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===day};
 const uniqueIds=(items,label)=>{const ids=items.map(v=>v&&v.id);if(ids.some(v=>!safeId(v))||new Set(ids).size!==ids.length)throw new Error('Identificadores inválidos en '+label);};
 for(const k of arrays)uniqueIds(x[k],k);
 const variantIds=[];
 for(const p of x.products){if(typeof p.name!=='string'||!Array.isArray(p.variants)||!p.variants.length)throw new Error('Producto inválido');uniqueIds(p.variants,'presentaciones');for(const v of p.variants){variantIds.push(v.id);for(const key of ['stock','cost','price','minStock'])if(!finiteNonnegative(v[key]))throw new Error('Cantidad o precio inválido');if(!Number.isInteger(v.stock)||!Number.isInteger(v.minStock))throw new Error('Existencias inválidas');if(p.mode==='unique'&&v.stock>1)throw new Error('Un producto de una sola unidad no puede tener más de una unidad');}}
 if(new Set(variantIds).size!==variantIds.length)throw new Error('Presentaciones duplicadas');
 for(const c of [...x.customers,...x.suppliers])if(typeof c.name!=='string'||!c.name.trim())throw new Error('Contacto inválido');
 const productById=new Map(x.products.map(p=>[p.id,p]));const variantOwner=new Map();for(const p of x.products)for(const v of p.variants)variantOwner.set(v.id,p.id);
 for(const sale of x.sales){if(!validDate(sale.date)||!Array.isArray(sale.items)||!sale.items.length||!Array.isArray(sale.payments)||!finiteNonnegative(sale.total)||!finiteNonnegative(sale.cogs)||!finiteNumber(sale.profit)||!['confirmed','cancelled'].includes(sale.status))throw new Error('Venta inválida');for(const i of sale.items)if(typeof i.productId!=='string'||typeof i.variantId!=='string'||!productById.has(i.productId)||variantOwner.get(i.variantId)!==i.productId||!Number.isInteger(i.qty)||i.qty<1||!finiteNonnegative(i.unitPrice)||!finiteNonnegative(i.costEach))throw new Error('Línea de venta inválida');const lineGross=sale.items.reduce((a,i)=>a+i.qty*i.unitPrice,0),lineCogs=sale.items.reduce((a,i)=>a+i.qty*i.costEach,0);if(!finiteNonnegative(sale.gross)||!finiteNonnegative(sale.discount)||!finiteNonnegative(sale.fees)||!finiteNonnegative(sale.otherExpenses)||Math.abs(lineGross-sale.gross)>.02||Math.abs(sale.total-(sale.gross-sale.discount))>.02||Math.abs(sale.cogs-lineCogs)>.02||Math.abs(sale.profit-(sale.total-sale.cogs-sale.fees-sale.otherExpenses))>.02)throw new Error('Totales de venta inconsistentes');for(const pay of sale.payments)if(!validDate(pay.date)||!finiteNonnegative(pay.amount))throw new Error('Pago inválido');if(sale.payments.reduce((a,p)=>a+p.amount,0)>sale.total+0.009)throw new Error('Los abonos superan el total de una venta');}

 for(const purchase of x.purchases){if(!validDate(purchase.date)||!Array.isArray(purchase.items)||!purchase.items.length||typeof purchase.received!=='boolean'||!finiteNonnegative(purchase.total)||!finiteNonnegative(purchase.extraCost))throw new Error('Compra inválida');const uniqueQty={};let purchaseBase=0;for(const i of purchase.items){const p=productById.get(i.productId);if(typeof i.productId!=='string'||typeof i.variantId!=='string'||!p||variantOwner.get(i.variantId)!==i.productId||!Number.isInteger(i.qty)||i.qty<1||!finiteNonnegative(i.unitCost))throw new Error('Línea de compra inválida');uniqueQty[i.variantId]=(uniqueQty[i.variantId]||0)+i.qty;purchaseBase+=i.qty*i.unitCost;if(p.mode==='unique'&&uniqueQty[i.variantId]>1)throw new Error('Un producto de una sola unidad aparece varias veces en la compra');}if(Math.abs(purchase.total-(purchaseBase+purchase.extraCost))>.02)throw new Error('Total de compra inconsistente');}
 if(x.moves!==undefined){
  if(!Array.isArray(x.moves))throw new Error('Movimientos inválidos');
  for(const m of x.moves){if(!m||!safeId(m.id)||!validDate(m.date)||typeof m.type!=='string'||typeof m.label!=='string'||!finiteNumber(m.qty)||(m.note!==undefined&&typeof m.note!=='string'))throw new Error('Movimiento de inventario inválido');}
 }
 return true;
}
function handleImport(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);validateBackup(x);if(!confirm('¿Reemplazar los datos actuales por los del respaldo? Primero exporta una copia si necesitas conservarlos.'))return;const previous=db;db=x;if(!save()){render();return;}startupStorageWarning='';closeModal();render();notify('Respaldo validado e importado correctamente.');}catch(e){notify('No se pudo importar. El archivo no cumple la estructura y los tipos esperados; los datos actuales se conservaron.',true);}};reader.onerror=()=>notify('No se pudo leer el archivo de respaldo.',true);reader.readAsText(file);}
